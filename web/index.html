<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iNat → Commons — image-less taxa</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Image-less taxa <span id="count" class="muted"></span></h1>
  <p>
    Wikidata taxa with an iNaturalist ID but no image. Click a draft to copy it; open
    <strong>View photos</strong> to pick a photo and pre-fill the Commons upload form.
    <span id="generated" class="muted"></span>
  </p>
  <div id="controls">
    <a class="page-link" href="search.html">Search the backlog →</a>
    <button id="hide-done">Hide done</button>
    <button id="download-uploaded">Download uploaded list</button>
    <span id="uploaded-count" class="muted"></span>
  </div>
  <section id="import-banner" hidden>
    <span id="import-msg"></span>
    <button id="import-run">Import into the database</button>
  </section>
  <section id="qs-panel">
    <div class="qs-head">
      <strong>QuickStatements</strong>
      <span id="qs-count" class="muted"></span>
      <button id="qs-copy" disabled>Copy</button>
      <button id="qs-confirm" disabled>Confirm pending</button>
      <span id="qs-hint" class="muted"></span>
    </div>
    <textarea id="qs-text" readonly placeholder="Pick a Wikidata image (P18) in a taxon's gallery — its P18 and Commons-category sitelink statements appear here, ready to paste into QuickStatements. Copy them, run the batch, then Confirm pending: a taxon is only marked done once both statements are live on Wikidata."></textarea>
  </section>
  <p id="status"></p>
  <table>
    <thead>
      <tr>
        <th class="check-col"></th>
        <th>Wikidata item</th>
        <th class="iucn-col">IUCN</th>
        <th>iNat taxon</th>
        <th>Commons category</th>
        <th>Photos</th>
        <th>Draft Wikitext (click to copy)</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <script type="module" src="js/main.js"></script>
</body>
</html>
