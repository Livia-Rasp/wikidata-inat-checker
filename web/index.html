<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iNat → Commons — image-less taxa</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="shell"></div>
  <h1>Image-less taxa <span id="count" class="muted"></span></h1>
  <p>
    Wikidata taxa with an iNaturalist ID but no image. Click a draft to copy it; open
    <strong>View photos</strong> to pick a photo and pre-fill the Commons upload form.
    <span id="generated" class="muted"></span>
  </p>
  <div id="controls">
    <a class="page-link" href="search.html">Search the backlog →</a>
    <button id="hide-done">Hide done</button>
    <button id="download-uploaded">Download uploaded list</button>
    <span id="uploaded-count" class="muted"></span>
  </div>
  <section id="import-banner" hidden>
    <span id="import-msg"></span>
    <button id="import-run">Import into the database</button>
  </section>
  <!-- Filled by worklist.js's createWorklistPage() from per-page config — see web/js/main.js. -->
  <section id="qs-panel"></section>
  <p id="status"></p>
  <table>
    <thead>
      <tr>
        <th class="check-col"></th>
        <th>Wikidata item</th>
        <th class="iucn-col">IUCN</th>
        <th>iNat taxon</th>
        <th>Commons category</th>
        <th>Photos</th>
        <th>Draft Wikitext (click to copy)</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <nav id="pager" class="pager" aria-label="Backlog pages" hidden></nav>
  <script type="module" src="js/main.js"></script>
</body>
</html>
