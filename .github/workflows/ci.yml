name: CI

# Run the unit suite on every PR (and on pushes to main so the default branch stays green).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite is fully stable from Node 26, which is the package.json engines floor.
          # The tests build only in-memory SQLite fixtures, so no taxa.db download.
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test
