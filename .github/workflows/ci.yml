name: CI

# Run the unit suite on every PR (and on pushes to main so the default branch stays green).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite is fully stable from Node 26, which is the package.json engines floor.
          # The tests build only in-memory SQLite fixtures, so no taxa.db download.
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test

  # Build the image so it cannot rot unnoticed — a dependency bump or a Node version move would
  # otherwise only surface the next time someone deployed. Build only: publishing to a registry is
  # slice 9, and needs credentials this workflow deliberately does not have.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wikidata-inat-checker .

      # Building proves the syntax; starting proves the image. The interesting failures are all
      # at boot — a missing file the .dockerignore excluded, a path that only resolves relative to
      # the repo, a directory the `node` user cannot write.
      - name: The container starts, serves, and stops cleanly
        run: |
          set -euo pipefail
          mkdir -p /tmp/winc-data
          docker run -d --name winc --init --user node --read-only --tmpfs /tmp \
            -p 127.0.0.1:8080:8080 -v /tmp/winc-data:/app/data \
            -e HOST=0.0.0.0 -e ALLOW_REMOTE_WRITES=1 -e FINDINGS_DB=/app/data/findings.db \
            wikidata-inat-checker

          # An empty directory is the interesting case: the schema has to be created on a
          # read-only root filesystem, on the mount, by an unprivileged user.
          # Errors are silenced only while polling: a connection refused here just means the
          # server has not finished booting, and the unsilenced check below is what decides.
          for _ in $(seq 30); do
            curl -fs -o /dev/null http://127.0.0.1:8080/ 2>/dev/null && break || sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS 'http://127.0.0.1:8080/api/findings?limit=1' | grep -q '"taxa"'
          test -f /tmp/winc-data/findings.db

          docker stop winc
          # Exit 0, not 137: the app must handle SIGTERM itself rather than be killed when the
          # grace period runs out.
          test "$(docker inspect winc --format '{{.State.ExitCode}}')" = 0
