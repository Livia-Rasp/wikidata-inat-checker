# Runs Renovate against this repository.
#
# Self-hosted rather than the Mend-hosted GitHub App, deliberately: nothing third-party gets write
# access to a repository that publishes a container image. The same choice the sibling
# `livias-random-access` made, so one pattern covers both.
#
# The policy lives in renovate.json5 and is platform-agnostic. This workflow is the only
# GitHub-specific piece; moving platforms means replacing this file and nothing else.

name: Renovate

on:
  # Early Monday, inside the all-Monday window in renovate.json5. This only decides how often
  # Renovate gets to look; the config decides what it may do when it does.
  #
  # 01:17 UTC (03:17 Berlin in summer) because GitHub starts scheduled runs late — up to six and a
  # half hours so far — so starting early keeps even a badly delayed run on Monday. Off the hour
  # because GitHub's own docs name the top of the hour as the busiest time, when scheduled runs
  # are most likely to be delayed or dropped.
  schedule:
    - cron: '17 1 * * 1'
  # So a run can be forced without waiting a week — needed when first setting this up, and when a
  # CVE lands and the dashboard should be refreshed now.
  #
  # It is also the insurance against a documented footgun: GitHub disables scheduled workflows in
  # public repositories after 60 days with no repository activity. A quiet seven-dependency repo
  # behind a weekly schedule can plausibly reach that, and Renovate would then go silent rather
  # than fail loudly. GitHub emails first; running this by hand re-enables it.
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options: [info, debug]

# Two runs at once would fight over the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned rather than tag-pinned: this step runs with a token that can write to the
      # repository, so a moved tag would be a direct path to arbitrary code holding those rights.
      #
      # Renovate keeps these pins fresh: the github-actions manager reads a `@<sha> # vX.Y.Z` pin
      # and updates the digest and the comment together. That edits this file, so it is one of the
      # reasons the token needs Workflows write — see below.
      - name: Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          # NOT the default GITHUB_TOKEN. Pull requests opened with it get their workflow runs
          # held in an approval-required state (GitHub changed this in June 2026 — before that
          # they did not run at all). Either way CI does not run unattended, so an automerge could
          # never be satisfied without a human clicking approve on every PR, which defeats the
          # point. This needs a fine-grained PAT or a GitHub App token.
          #
          # Needs Contents, Pull requests, Issues, Workflows and Commit statuses write, plus
          # Dependabot alerts read. Issues write keeps the Dependency Dashboard (#27) current —
          # without it the issue can be created but never updated. Workflows write is needed by any
          # Action update at all, digest pinning or not: every one is an edit under
          # .github/workflows/. Commit statuses write is for the `renovate/stability-days` status;
          # without it Renovate misreports the failure as "Repository has changed during
          # renovation" and aborts after one branch. Missing any of them still leaves this step
          # green, so check its log. See docs/threat-model.md.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          # Only this repository. Renovate would otherwise try to discover every repository the
          # token can see, which for a personal account is all of them — and the sibling projects
          # each get their own decision, tracked in the vault, not one made by a token's scope.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The config is the file in the repo. Stated explicitly so a future global default
          # cannot quietly take precedence.
          RENOVATE_ONBOARDING_CONFIG_FILE_NAME: renovate.json5

      # A safety net, no longer a workaround. From 2026-08-24 Renovate repeatedly pushed a branch
      # and then, a few hundred ms later, aborted with "Repository has changed during renovation"
      # before opening the PR for it. Nothing had changed. The cause, found with a debug run on
      # 2026-09-14: the token lacked Commit statuses write, so setting the
      # `renovate/stability-days` status on the pushed commit 403'd — and Renovate's GitHub
      # platform code rethrows *any* status failure as that repository-changed error. Granting
      # the permission fixed it; the first run after opened all its PRs itself.
      #
      # Kept because the signature is cheap to catch and easy to reintroduce: a token rotated
      # without that grant strands a branch per run again, and the push itself always succeeds,
      # so the branch is complete and correct — just without a PR. `if: always()` so this still
      # runs on that abort (the Renovate step itself reports success either way).
      #
      # Scoped to any `renovate/*` branch with zero PRs ever raised against it — that is exactly
      # the signature of this failure, and nothing else leaves a renovate/* branch in that state
      # (Renovate opens the PR immediately after pushing, in the same run, when it doesn't hit
      # this abort). Uses RENOVATE_TOKEN rather than GITHUB_TOKEN for the same reason the
      # Renovate step does: a PR opened with the default token has its CI run held for approval.
      #
      # Checks for an OPEN PR specifically, not `--state all`: Renovate reuses branch names
      # (e.g. renovate/all-non-major-dependencies comes back every week), so a branch that had a
      # PR merged weeks ago still matches `--state all` today even though it now holds an
      # unrelated, unreviewed push. `--state all` was tried first and missed exactly this case in
      # testing — the one question that matters is "did Renovate already open a PR for what's on
      # this branch right now", and an open PR is the only state that answers yes.
      - name: Open PRs for Renovate branches stranded by the abort above
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          for branch in $(gh api "repos/$repo/branches" --paginate --jq '.[].name | select(startswith("renovate/"))'); do
            existing=$(gh pr list --repo "$repo" --head "$branch" --base main --state open --json number --jq 'length')
            if [ "$existing" -eq 0 ]; then
              title=$(gh api "repos/$repo/branches/$branch" --jq '.commit.commit.message' | head -n1)
              echo "Opening PR for stranded branch $branch: $title"
              body=$(printf '%s\n' \
                'Opened automatically. Renovate pushed this branch but then aborted with "Repository has changed' \
                'during renovation" before it could open the PR itself. That abort usually means RENOVATE_TOKEN has' \
                'lost Commit statuses write — see docs/threat-model.md.' \
                'The branch content comes straight from Renovate; only the PR itself was created by hand, by this' \
                'workflow step.')
              gh pr create --repo "$repo" --head "$branch" --base main --title "$title" --body "$body"
            fi
          done
